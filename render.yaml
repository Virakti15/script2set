services:
  - type: web
    name: script2set-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    disk:
      name: script2set-data
      mountPath: /var/data/script2set
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APP_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data/script2set
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ACCESS_PASSWORD
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: IMAGE_PROVIDER
        value: none
